<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact · Santa Booking</title>
<meta name="description" content="Get in touch with the Swefieh Orthodox Scouts about Santa's Christmas Eve visits.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<link rel="icon" href="logo.png">
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="garland" aria-hidden="true"></div>
<div class="wrap">
  <header class="masthead"></header>

  <section class="hero">
    <div class="wreath small"><div class="disc"><img src="logo.png" alt=""></div></div>
    <p class="eyebrow">We'd love to hear from you</p>
    <h1>Write to <em>Santa's Helpers</em></h1>
    <span class="flourish"></span>
    <p class="lede">Questions about your booking, changing your time, or your donation? Send us a note below and we'll get back to you.</p>
  </section>

  <div class="contact-grid narrow" id="cards"></div>

  <form id="msg-form" class="card narrow" novalidate>
    <fieldset>
      <legend><span class="n">✉</span><span class="tt">Send Us a Message</span></legend>
      <div class="row two">
        <div class="field">
          <label class="req" for="m-name">Your name</label>
          <input id="m-name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="m-phone">Mobile number</label>
          <input id="m-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="07X XXX XXXX">
        </div>
      </div>
      <div class="field">
        <label for="m-email">Email</label>
        <input id="m-email" type="email" autocomplete="email" placeholder="Optional">
      </div>
      <div class="field">
        <label class="req" for="m-text">Message</label>
        <textarea id="m-text" rows="5" required></textarea>
      </div>
    </fieldset>
    <div class="form-error" id="m-error" hidden></div>
    <div class="sent" id="m-sent" hidden>Thank you. We have your message and will get back to you soon.</div>
    <button class="submit" id="m-submit" type="submit">Send Message</button>
  </form>

  <footer class="foot"></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="demo.js"></script>
<script src="shared.js"></script>
<script>
(function () {
  const { cfg, sb, esc, page } = window.Santa;
  const C = cfg.CONTACT || {};
  const $ = (id) => document.getElementById(id);
  page("contact");

  const social = [
    C.instagram && `<a class="pill" href="${esc(C.instagram)}" target="_blank" rel="noopener">Instagram</a>`,
    C.facebook && `<a class="pill" href="${esc(C.facebook)}" target="_blank" rel="noopener">Facebook</a>`,
    C.website && `<a class="pill" href="${esc(C.website)}" target="_blank" rel="noopener">Website</a>`,
  ].filter(Boolean);
  const cards = social.length ? [`<div class="contact-card"><h3>Follow Us</h3><div class="pill-row">${social.join("")}</div></div>`] : [];
  $("cards").innerHTML = cards.join("");

  $("msg-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = $("m-name").value.trim(), text = $("m-text").value.trim();
    $("m-name").classList.toggle("invalid", name.length < 2);
    $("m-text").classList.toggle("invalid", text.length < 2);
    const err = (msg) => { $("m-error").textContent = msg || ""; $("m-error").hidden = !msg; };
    if (name.length < 2 || text.length < 2) return err("Please write your name and a message.");
    err("");
    const btn = $("m-submit");
    btn.disabled = true; btn.textContent = "Sending…";
    const { data, error } = await sb.rpc("public_message", {
      p_name: name, p_phone: $("m-phone").value, p_email: $("m-email").value, p_message: text,
    });
    btn.disabled = false; btn.textContent = "Send Message";
    if (error || !data) { console.error(error); return err("Your message didn't send. Check your connection and try again."); }
    if (!data.ok) return err(data.reason === "busy" ? "We're getting a lot of messages right now. Please try again in a few minutes, or call us." : "Please write your name and a message.");
    $("msg-form").reset();
    $("m-sent").hidden = false;
  });
})();
</script>
</body>
</html>
